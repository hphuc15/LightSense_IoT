<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 WiFi Config</title>
</head>

<body>
  <form action="/" method="post" class="login-form">
    <div class="form-group">
      <label for="ssid">SSID:</label>
      <input id="ssid" name="ssid" type="text" required>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>
    <div class="form-group">
      <label for="server_ip">Server IP:</label>
      <input id="server_ip" name="server_ip" type="text" required>
    </div>
    <button type="submit" class="submit-btn">Login</button>
  </form>
</body>

</html>

<style>
  .login-form {
    max-width: 300px;
    margin: 20px auto;
    padding: 20px;
    font-family: Consolas, sans-serif;
  }

  .form-group {
    margin-bottom: 15px;
  }

  label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    outline: none;
    border-color: #4c98af;
    box-shadow: 0 0 5px rgba(76, 132, 175, 0.3);
  }

  .submit-btn {
    width: 100%;
    padding: 10px;
    background-color: #4c9eaf;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }

  .submit-btn:hover {
    background-color: #3b7f8c;
  }
</style>
